<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Build organic molecules, learn IUPAC nomenclature, practice organic chemistry, take exams, and create reproducible worksheets with OrgoRush."
    />
    <title>OrgoRush — Interactive Organic Chemistry &amp; IUPAC Practice</title>
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("hydrocarbon-lab-language");
        } catch {
          // Storage may be disabled; browser language remains a safe fallback.
        }
        const language = saved === "es" || saved === "en"
          ? saved
          : navigator.language.toLowerCase().startsWith("es") ? "es" : "en";
        window.location.replace(new URL(`${language}/`, window.location.href).href);
      })();
    </script>
  </head>
  <body class="antialiased">
    <noscript>Choose a language / Elige un idioma: <a href="./es/">ES</a> · <a href="./en/">EN</a></noscript>
  </body>
</html>
